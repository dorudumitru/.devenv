[line_break]
disabled = true

[aws]
symbol = "  "

[conda]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " "
truncation_length = 4
style = "bold lavender"

[docker_context]
symbol = " "

[dotnet]
symbol = "󰘐 "
format = "via [$symbol($version )]($style)"
detect_extensions = ["csproj", "fsproj", "xproj", "sln"]

[elixir]
symbol = " "

[elm]
symbol = " "

[git_branch]
symbol = " "
