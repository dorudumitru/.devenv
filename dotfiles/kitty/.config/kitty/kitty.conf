## Font

# font_size 10.8
# font_family      family='MonoLisa Variable' style=Medium variable_name=MonoLisaVariableRegular
# bold_font        family='MonoLisa Variable' style=Bold variable_name=MonoLisaVariableRegular
# italic_font      family='MonoLisa Variable' style='Medium Italic' variable_name=MonoLisaVariableItalic
# bold_italic_font family='MonoLisa Variable' style='Black Italic' variable_name=MonoLisaVariableItalic

# font_size 11.2
# font_family        family="JetBrains Mono" style=Medium
# bold_font          family="JetBrains Mono" style=Bold
# italic_font        family="JetBrains Mono" style='Medium Italic'
# bold_italic_font   family="JetBrains Mono" style='Bold Italic'

font_size 11.2
font_family      family=Lilex style=Medium variable_name=Lilex
bold_font        family=Lilex style=Bold variable_name=Lilex
italic_font      family=Lilex style=Medium variable_name=LilexItalic
bold_italic_font family=Lilex style=Bold variable_name=LilexItalic

# Nerd Font Symbols
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font

## Cursor
shell_integration no-cursor
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.01 0.3
cursor_trail_start_threshold 0

## Window
hide_window_decorations yes
remember_window_size yes
resize_in_steps yes
initial_window_width  928
initial_window_height 600
window_padding_width 1
background_opacity 0.95
background_blur 8

## Tabs
tab_powerline_style slanted
tab_bar_style powerline
tab_bar_background              #24273a
active_tab_foreground           #24273a
active_tab_background           #f4dbd6
active_tab_font_style           bold
inactive_tab_foreground         #a5adcb
inactive_tab_background         #24273a
inactive_tab_font_style         normal

# Scroll
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings
kitty_mod ctrl+shift
enabled_layouts splits:split_axis=horizontal
map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+minus launch --location=hsplit --cwd=current
map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right
map kitty_mod+k neighboring_window up
map kitty_mod+j neighboring_window down
map kitty_mod+r load_config_file
map ctrl+0 change_font_size all 0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map shift+enter send_text all \e\r

